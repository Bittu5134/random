name: ORV News Monitor

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    # Schedule to run every 30 minutes on Monday, Tuesday, and Wednesday
    # This translates to:
    # - At minute 0 and 30 past every hour
    # - On Monday, Tuesday, and Wednesday (1, 2, 3)
    - cron: '0,30 * * * 1-3'

permissions:
  contents: write

jobs:
  check_and_notify_orv_chapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Use '3.x' for the latest Python 3 version

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run ORV Chapter Monitor script
        env:
          PYTHONIOENCODING: UTF-8
          WEBHOOK: ${{ secrets.WEBHOOK }}
        run: python orvcord/main.py

      - name: Commit and push chapter file changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add orvcord/feed.txt # Specifically add the chapter file
          
          # Check if there are any changes to commit for the specific file
          if git diff --cached --exit-code orvcord/feed.txt; then
            echo "No changes to orvcord/feed.txt to commit."
          else
            git commit -m "Automated: Update ORV chapter progress [skip ci]" # Added [skip ci] to prevent re-triggering
            git pull --rebase origin $(git rev-parse --abbrev-ref HEAD) || \
            (git stash && git pull --rebase origin $(git rev-parse --abbrev-ref HEAD) && git stash pop)
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
