name: ORVcord news

on:
  # Allows you to run this workflow manually from the Actions tab in GitHub
  workflow_dispatch:

  # Schedules the workflow to run every 30 minutes on Tuesdays
  # Cron syntax:
  # minute hour day_of_month month day_of_week
  # */30: Every 30 minutes
  # *: Any hour
  # *: Any day of the month
  # *: Any month
  # 2: Tuesday (0 = Sunday, 1 = Monday, ..., 6 = Saturday)
  schedule:
    - cron: '*/30 * * * 1,2,3'

jobs:
  run-script-and-commit:
    runs-on: ubuntu-latest

    env:
      # Set Python's default encoding to UTF-8
      PYTHONIOENCODING: utf-8
      # Pass the webhook URL as an environment variable from GitHub Secrets
      ORVCORD_WEBHOOK: ${{ secrets.ORVCORD_WEBHOOK }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Use the latest available Python 3.x version

      - name: Install dependencies (optional)
        # If your Python script has dependencies listed in a requirements.txt file,
        # this step will install them. Uncomment if needed.
        # run: |
        #   python -m pip install --upgrade pip
        #   pip install -r requirements.txt
        # Commented out by default; uncomment if you have a requirements.txt

      - name: Run Python script
        # This step executes your Python file.
        # Ensure the path 'orvcord/main.py' is correct relative to your repository root.
        run: python orvcord/main.py

      - name: Check for changes
        id: git_status
        run: echo "::set-output name=status::$(git status --porcelain)"

      - name: Commit and push new files (if any)
        if: ${{ steps.git_status.outputs.status != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Automated: Add/update files generated by orvcord/main.py'
          git push
