on:
  repository_dispatch:
    types: [follow]

jobs:
  my_job:
    runs-on: ubuntu-latest
    steps:
      - name: Use Webhook Data
        run: |
          echo "User: ${{ github.event.client_payload.user }}"
          echo "Status Gained: ${{ github.event.client_payload.gained }}"
          echo "Data: ${{ github.event.client_payload }}"
